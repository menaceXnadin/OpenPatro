name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Target the project files directly: the .NET 8 SDK cannot read OpenPatro.slnx.
      - name: Build app (Release x64)
        run: dotnet build OpenPatro.csproj -c Release -p:Platform=x64

      - name: Test
        run: dotnet test tests/OpenPatro.Tests/OpenPatro.Tests.csproj -c Release
